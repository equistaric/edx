<style>
:root{--crimson:#A51C30;--crimson-d:#6F1220;--crimson-l:#C8455A;--bg:#f7f5f5;--card:#fff;
  --ink:#1e232a;--muted:#6e7681;--line:#e6e2e2;--hi:#fdf3f4;--green:#1E7A34;--green-l:#e6f4ea;
  --amber:#b7791f;--amber-l:#fff6e5;--sat:#f3e9eb;--blue:#1f4e79;--blue-l:#e8f0fb;--radius:12px;--hh:96px;
  --shadow:0 1px 2px rgba(30,20,22,.06),0 8px 24px rgba(30,20,22,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--crimson:#e2687d;--crimson-d:#f093a3;
  --crimson-l:#c8455a;--bg:#141416;--card:#1c1d20;--ink:#e9eaec;--muted:#9aa0a8;--line:#2e2f34;--hi:#2a1c20;
  --green:#63c97e;--green-l:#173021;--amber:#e3b04b;--amber-l:#2e2612;--sat:#2a2024;--blue:#8db4e2;--blue-l:#1b2838;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top)}
.hbar{height:3px;background:linear-gradient(90deg,var(--crimson),var(--crimson-d))}
.hin{padding:8px 14px;display:flex;gap:10px;align-items:center}
.hin img{width:34px;height:34px;object-fit:contain}
.t1{font-size:15px;font-weight:700;color:var(--crimson);line-height:1.15}
.t2{font-size:11px;color:var(--muted)}
.grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--crimson);color:#fff;border-color:var(--crimson);font-weight:600}
button.sm{font-size:12px;padding:3px 10px}
button.ghost{border-color:transparent;color:var(--crimson);background:transparent}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--crimson);outline-offset:-1px}
input[type=text],input[type=password],textarea{width:100%}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.n{font-size:11px;color:var(--muted)}
.mainnav{display:flex;border-top:1px solid var(--line)}
.mainnav button{flex:1;border:0;border-radius:0;padding:8px 2px;font-weight:700;color:var(--muted);background:var(--card);border-bottom:3px solid transparent;font-size:13.5px;white-space:nowrap}
.mainnav button[aria-pressed="true"]{color:var(--crimson);border-bottom-color:var(--crimson)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--crimson);color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center;vertical-align:1px}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 40px}
#syncLbl{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap}
#syncLbl.bad{color:var(--crimson)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--crimson);display:flex;gap:8px;align-items:center}
.card h3 .n{font-weight:500}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--crimson) 10%,transparent);color:var(--crimson);white-space:nowrap}
.tag.t{background:#eef2ff;color:#4338ca}.tag.g{background:var(--green-l);color:var(--green)}.tag.b{background:var(--blue-l);color:var(--blue)}.tag.a{background:var(--amber-l);color:var(--amber)}.tag.m{background:var(--line);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);max-width:100%}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:13px;color:var(--muted);background:var(--card);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--crimson);color:#fff;font-weight:600}
.seg button[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.msg{font-size:13px;min-height:18px;margin-top:6px}.msg.bad{color:var(--crimson)}.msg.good{color:var(--green)}
details summary{cursor:pointer;color:var(--crimson);font-weight:600;font-size:14px}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .tx{flex:1;min-width:0;font-size:14px}.row .tx small{display:block;color:var(--muted);font-size:12px}
.kv{font-size:13px;color:var(--muted);line-height:1.7}.kv b{color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stat div{background:var(--sat);border-radius:10px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--crimson)}
.stat small{font-size:11px;color:var(--muted)}
/* ---------- 登录 ---------- */
.login{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 26px 22px;width:100%;max-width:380px;text-align:center}
.lcard img{width:64px;height:64px;object-fit:contain}
.lcard h1{font-size:18px;color:var(--crimson);margin:10px 0 2px}
.lcard .t2{margin-bottom:18px}
.lcard input{margin-bottom:10px;font-size:15px;padding:10px 12px;text-align:left}
.lcard .err{color:var(--crimson);font-size:13px;min-height:18px;margin:2px 0 6px}
.lcard .primary{width:100%;padding:10px;font-size:15px}
.lcard .foot{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
/* ---------- 今天 / 我的 ---------- */
.hero2{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvl{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--crimson) var(--deg,0deg),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:none}
.lvl div{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--crimson);font-size:18px;line-height:1}
.lvl small{font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.hi{font-size:18px;font-weight:700}
.xpbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.xpbar i{display:block;height:100%;background:var(--crimson)}
.week{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:6px}
.week div{flex:1;background:var(--crimson);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.week div.z{background:var(--line)}
.week div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.badges2{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:var(--card)}
.bd .ic{font-size:26px;line-height:1.1}
.bd b{display:block;font-size:12px;margin-top:3px}
.bd small{font-size:10px;color:var(--muted);display:block;line-height:1.3}
.bd.lock{opacity:.45;filter:grayscale(1)}
.board li{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.board li:first-child{border-top:0}
.board li.me{color:var(--crimson);font-weight:700}
.board .rk{width:22px;text-align:center;color:var(--muted);font-weight:700}
.board .xp{margin-left:auto;font-size:12px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 button{padding:12px 6px;border-radius:12px;text-align:center;line-height:1.3}
.big3 button b{display:block;font-size:20px;color:var(--crimson)}
.big3 button small{font-size:12px;color:var(--muted)}
/* ---------- 刷题 ---------- */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--hh);z-index:25}
.tabs button{flex:1;border:0;border-radius:0;padding:8px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-size:14px}
.tabs button[aria-pressed="true"]{color:var(--crimson);border-bottom-color:var(--crimson)}
.hero{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--crimson)}
.ring .pct small{font-size:10px;color:var(--muted);font-weight:500}
.status{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.st-ok{background:var(--green-l);color:var(--green)}.st-late{background:var(--hi);color:var(--crimson)}.st-ahead{background:#e8f0fb;color:#1f4e79}.st-free{background:var(--sat);color:var(--crimson)}
.we{background:var(--crimson);color:#fff;border-radius:5px;padding:0 5px;font-size:10px;font-weight:700}
.wd{background:var(--line);color:var(--muted);border-radius:5px;padding:0 5px;font-size:10px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px}
.chap .chh{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--crimson);font-size:14px;margin-bottom:8px}
.chap .chh small{font-weight:500;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sc{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer;background:var(--card);min-width:0;position:relative}
.sc:hover{border-color:var(--crimson-l)}
.sc b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .d{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;margin-top:2px}
.sc .s{font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.sc.done{background:var(--green-l);border-color:var(--green)}.sc.done .s{color:var(--green);font-weight:700}
.sc.part{background:var(--amber-l);border-color:var(--amber)}.sc.part .s{color:var(--amber);font-weight:700}
.sc.late{border-color:var(--crimson);box-shadow:inset 0 0 0 1px var(--crimson)}.sc.late .s{color:var(--crimson);font-weight:700}
.sc.opt{background:var(--bg)}.sc.hw{opacity:.55}.sc.na{opacity:.35;cursor:default}
.pills{display:flex;gap:4px;width:100%}
.pill{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;border:1.5px solid var(--line);border-radius:8px;height:32px;display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:.12s;background:var(--card)}
.pill::before{content:'';display:inline-block;width:0;transition:.12s}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.pill.on::before{content:'✓';width:12px;font-weight:700}
.pill:active{transform:scale(.94)}
.sethead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sethead h2{margin:0;font-size:16px;color:var(--crimson)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.qbox.ok{border-color:var(--green)}.qbox.bad{border-color:var(--crimson)}
.qh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}

async function rpc(fn,args){
  if(MOCK)return mockRpc(fn,args||{});
  if(!SY.url||!SY.key)throw new Error('NOCFG');
  let r;
  try{r=await fetch(`${SY.url}/rest/v1/rpc/${(SY.prefix||'')}${fn}`,{method:'POST',headers:{apikey:SY.key,Authorization:'Bearer '+SY.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});}
  catch(e){throw new Error('NET');}
  if(r.status===404)throw new Error('NOINIT');
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('HTTP '+r.status));
  return j;
}

  const ik={};for(const [q,t] of Object.entries(j.ink||{}))ik[q]=(t||0)*1000;
  const sb={};for(const [s,v] of Object.entries(j.submissions||{}))sb[s]={sc:v[0],tt:v[1],t:(v[2]||0)*1000};

async function flush(){
  if(flushing||!session)return;
  if(!npend()){setSync('ok');return;}
  flushing=true;setSync('busy');
  const chk=j=>{if(!j.ok)throw new Error(j.error||'save');};
  try{
    if(Object.keys(pending.practice).length){const snap={...pending.practice};chk(await rpc('save_practice',{p_token:session.token,p_items:snap}));
      for(const [k,v] of Object.entries(snap))if(pending.practice[k]===v)delete pending.practice[k];}
    if(Object.keys(pending.wrong).length){const snap={...pending.wrong};
      chk(await rpc('save_wrong',{p_token:session.token,p_items:Object.entries(snap).map(([q,o])=>({q,on:!!o.on,m:!!o.m}))}));
      for(const [k,v] of Object.entries(snap))if(pending.wrong[k]===v)delete pending.wrong[k];}
    if(Object.keys(pending.attempts).length){const snap={...pending.attempts};
      chk(await rpc('save_attempts',{p_token:session.token,p_items:Object.entries(snap).map(([q,o])=>({q,a:o.a==null?null:o.a,ok:o.ok==null?null:!!o.ok,s:!!o.s}))}));
      for(const [k,v] of Object.entries(snap))if(pending.attempts[k]===v)delete pending.attempts[k];}
    for(const [q,b] of Object.entries({...pending.notes})){chk(await rpc('save_note',{p_token:session.token,p_qid:q,p_body:b||''}));if(pending.notes[q]===b)delete pending.notes[q];}
    for(const [q,s] of Object.entries({...pending.ink})){chk(await rpc('save_ink',{p_token:session.token,p_qid:q,p_strokes:s}));if(pending.ink[q]===s)delete pending.ink[q];}
    for(const [s,o] of Object.entries({...pending.subs})){chk(await rpc('save_submission',{p_token:session.token,p_set:s,p_score:o.sc==null?null:o.sc,p_total:o.tt==null?null:o.tt}));if(pending.subs[s]===o)delete pending.subs[s];}
    if(pending.xp!=null){const v=pending.xp;chk(await rpc('set_xp',{p_token:session.token,p_xp:v}));if(pending.xp===v)pending.xp=null;xpPushed=v;}
    saveCache();setSync('ok');
  }catch(e){if(e.message==='auth'){flushing=false;logout(true);return;}setSync('fail',errMsg(e));}

  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);t++;let alive=0;for(const p of ps){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.012;p.rot+=.1;if(p.a<=0)continue;alive++;
    x.save();x.globalAlpha=p.a;x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();}
    if(alive&&t<160)requestAnimationFrame(f);else{x.clearRect(0,0,cv.width,cv.height);cv.hidden=true;}})();}

function renderSet(){const s=setOf(doSet);if(!s){doSet=null;renderPlan();return;}

      html+=`<div class="qbox ${done?(at.ok?'ok':'bad'):''}" id="q_${it.n}"><div class="qh ${done?(at.ok?'okh':'badh'):''}"><span class="no">#${pad(it.n)}</span><span class="n">${esc(it.o)}${it.sy?` · 考纲 ${it.sy}`:''}</span><span class="grow"></span>${done?(at.ok?'<span class="res ok">✓ 答对</span>':`<span class="res bad">✗ ${at.a?`你选 ${at.a}`:'未作答'} · 答案 ${it.L}</span>`):''}${ink?'<span class="tag" title="有批注">✎</span>':''}${wrong.has(it.id)?'<span class="tag" title="在错题本里">📕</span>':''}</div>

        </div>`;}

  }else{

/* 套题页里的批注画布：懒加载笔迹、按需渲染 */

  cvs.forEach(cv=>{bindCanvas(cv,cv.dataset.q,+cv.dataset.i,()=>false,()=>window);const img=cv.previousElementSibling;if(!(img.complete&&img.naturalWidth))img.onload=()=>fitCanvas(cv);io.observe(cv);});
  addEventListener('resize',fitAll,{once:true});}
function finalizeSet(id){if(!setOf(id))return;const s=setOf(id);if(isDone(id))return toast('这套已经清零了');

/* ---- 笔记区：虚拟条带 i = 100 + 段序号，高度随笔迹自动加长；随笔迹一起入库 ---- */
const NB=100,EXTRA={};
const nbRatio=(q,k)=>{let m=0;for(const s of (INKS[q]||[]))if(s.i===NB+k)for(let j=1;j<s.p.length;j+=2)m=Math.max(m,s.p[j]);return Math.max(0.18,m+0.06)+((EXTRA[q]||{})[k]||0);};
const nbAny=q=>(INKS[q]||inkCache[q]||[]).some(s=>s.i>=NB);
const nbHas=(q,k)=>(INKS[q]||inkCache[q]||[]).some(s=>s.i===NB+k);

/* ======================================================================
   手写引擎（套题页批注画布 + 全屏手写页共用）
   ====================================================================== */
const INKS={};                      // q -> strokes（内存里的当前笔迹）
const CVS={};                       // q -> [canvas...]
const DRAW={tool:'pen',color:'#dc2626',width:2.5,finger:false,cur:null,penSeen:false,penNear:0,penActive:false,scroll:null,lastQ:null,dirty:new Set(),saveT:null};
async function loadInk(q){if(INKS[q])return INKS[q];let saved=pending.ink[q]||inkCache[q]||null;
  if(!saved){saved=[];if(inkIds[q]){try{const j=await rpc('get_ink',{p_token:session.token,p_qid:q});if(j.ok){saved=j.strokes||[];inkCache[q]=saved;}}catch(e){toast('手写内容加载失败：'+errMsg(e));}}}
  if(!INKS[q])INKS[q]=saved.slice();return INKS[q];}
function bindCanvas(cv,q,i,lockedFn,scrollerFn){cv._ink={q,i,locked:lockedFn,scroller:scrollerFn};(CVS[q]=CVS[q]||[]).push(cv);
  cv.onpointerdown=e=>pdown(e,cv);cv.onpointermove=e=>pmove(e,cv);cv.onpointerup=cv.onpointercancel=cv.onpointerleave=e=>pup(e,cv);}
function fitCanvas(cv){const img=cv.previousElementSibling;const r=img.getBoundingClientRect();if(!r.width)return;const z=zoomOf(cv),cw=r.width/z,ch=r.height/z,bs=(devicePixelRatio||1)*Math.min(z,2);cv.width=Math.round(cw*bs);cv.height=Math.round(ch*bs);cv.style.height=ch+'px';cv._bs=bs;redraw(cv);}
function ctxOf(cv){const c=cv.getContext('2d');const bs=cv._bs||(devicePixelRatio||1);c.setTransform(bs,0,0,bs,0,0);c.lineCap='round';c.lineJoin='round';return c;}
function smoothPts(pts){const P=[];for(let k=0;k<pts.length;k+=2)P.push([pts[k],pts[k+1]]);if(P.length<3)return P;
  const out=[P[0]];for(let i=1;i<P.length-1;i++)out.push([(P[i-1][0]+2*P[i][0]+P[i+1][0])/4,(P[i-1][1]+2*P[i][1]+P[i+1][1])/4]);out.push(P[P.length-1]);return out;}
function curvePath(c,P,Wd){c.moveTo(P[0][0]*Wd,P[0][1]*Wd);for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2*Wd,my=(P[i][1]+P[i+1][1])/2*Wd;c.quadraticCurveTo(P[i][0]*Wd,P[i][1]*Wd,mx,my);}const L=P[P.length-1];c.lineTo(L[0]*Wd,L[1]*Wd);}
function drawStroke(c,s,Wd){if(s.f){const x=s.p[0]*Wd,y=s.p[1]*Wd,rad=Math.max(10,Wd*0.018);c.strokeStyle='#dc2626';c.lineWidth=2.5;c.beginPath();c.arc(x,y,rad,0,Math.PI*2);c.stroke();c.fillStyle='#dc2626';c.font=`bold ${rad*1.3}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('✗',x,y+1);return;}
  if(s.k){c.strokeStyle=s.c;c.lineWidth=s.w*Wd;c.beginPath();for(let k=0;k<s.p.length;k+=2){k?c.lineTo(s.p[k]*Wd,s.p[k+1]*Wd):c.moveTo(s.p[k]*Wd,s.p[k+1]*Wd);}c.stroke();return;}
  const P=smoothPts(s.p),base=s.w*Wd;c.fillStyle=s.c;c.strokeStyle=s.c;

  const q=s.q&&s.q.length===P.length?s.q:null;

let rvDeck=[],rvAt=0,rvShown=false;
function reviewStart(deck){rvDeck=deck.slice();rvAt=0;if(!rvDeck.length)return;$('#rv').classList.add('on');document.body.style.overflow='hidden';reviewPaint();}
function reviewEnd(){$('#rv').classList.remove('on');document.body.style.overflow='';revRender();}
function answerHtml(it){const key=it.id.split(':')[1]+'#Q'+it.q,ex=EXPL[key];
  if(it.mc===1&&ex)return `<div class="row2"><b>答案：${it.L||'?'}</b> · ${esc(ex.point||'')}</div>`+['A','B','C','D'].map(L=>`<div class="row2"><span class="${L===it.L?'ok':'bad'}">${L===it.L?'✓':'✗'} ${L}</span> ${esc(ex[L]||'')}</div>`).join('');
  if(it.a&&it.a.length)return '<div class="row2" style="color:var(--muted)">参考答案（评分方案）</div>'+it.a.map(s=>`<img src="${IMG(s)}" alt="">`).join('');
  return '<div class="row2" style="color:var(--muted)">本题没有收录答案</div>';}
function reviewPaint(){
  if(rvAt>=rvDeck.length){$('#rvNo').textContent='';$('#rvTag').textContent='';$('#rvPos').textContent='';$('#rvBar').style.width='100%';
    $('#rvQ').innerHTML=`<div class="rvdone"><h2>这一轮复习完成 🎉</h2><p style="color:var(--muted)">还剩 ${todo().length} 题没掌握。</p></div>`;$('#rvA').hidden=true;
    $('#rvF').innerHTML=`<button class="bigb" id="rvAgain">再练一轮未掌握的</button><button class="bigb primary" id="rvBack">回到错题库</button>`;
    $('#rvAgain').onclick=()=>{const d=todo();d.length?reviewStart(d):reviewEnd();};$('#rvBack').onclick=reviewEnd;return;}
  const it=rvDeck[rvAt];rvShown=false;
  $('#rvNo').textContent='#'+pad(it.n);const sR=SYL[it.sy];
  $('#rvTag').textContent=`第${it.ch}章 ${DATA.chapters[it.ch]?.cn||''}`+(it.sy?` · ${it.sy}${sR?' '+sR.en:''}`:'');
  $('#rvPos').textContent=`${rvAt+1} / ${rvDeck.length}`;$('#rvBar').style.width=(rvAt/rvDeck.length*100)+'%';
  $('#rvQ').innerHTML=it.i.map(s=>`<img src="${IMG(s)}" alt="">`).join('');$('#rvA').hidden=true;$('#rvA').innerHTML='';
  $('#rvF').innerHTML=`<button class="bigb primary" id="rvShow">显示答案</button>`;$('#rvShow').onclick=reviewReveal;$('.rvb').scrollTop=0;}
function reviewReveal(){const it=rvDeck[rvAt];rvShown=true;
  $('#rvA').innerHTML=answerHtml(it);$('#rvA').hidden=false;
  $('#rvF').innerHTML=`<button class="bigb b-again" id="rvAgainQ">还是不会</button><button class="bigb b-got" id="rvGot">已掌握</button>`;
  $('#rvAgainQ').onclick=()=>{setMastered(it.id,false);wbSave();rvAt++;reviewPaint();};
  $('#rvGot').onclick=()=>{setMastered(it.id,true);wbSave();rvAt++;reviewPaint();};}
$('#rvClose').onclick=reviewEnd;
document.addEventListener('keydown',e=>{if(!$('#rv').classList.contains('on'))return;
  if(e.key==='Escape'){e.preventDefault();reviewEnd();}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!rvShown&&$('#rvShow'))$('#rvShow').click();}
  if(rvShown&&e.key==='1'&&$('#rvAgainQ'))$('#rvAgainQ').click();
  if(rvShown&&e.key==='2'&&$('#rvGot'))$('#rvGot').click();});
document.addEventListener('click',e=>{
  if(e.target.id==='btnReview')return reviewStart(todo());
  if(e.target.id==='btnResetAll'){for(const q of mastered)pending.wrong[q]={on:true,m:false};mastered.clear();wbSave();revRender();return toast('已全部移回待复习');}
  const um=e.target.closest('[data-unmaster]');if(um){setMastered(um.dataset.unmaster,false);wbSave();revRender();return;}
  const mk=e.target.closest('[data-mark]');if(mk)return wbToggle(mk.dataset.mark);
  const op=e.target.closest('[data-open]');if(op)return openQ(op.dataset.open);});
function wbToggle(id){const add=!wrong.has(id);markWrong(id,add);wbSave();revRender();renderPlan();
  toast(add?'已记录到错题本':'已从错题本移除');if($('#dlg').open&&$('#dlg').dataset.id===id)syncDlg(id);}
function openQ(id){const it=byId.get(id);if(!it)return;const d=$('#dlg');d.dataset.id=id;
  $('#dNo').textContent='#'+pad(it.n);$('#dTitle').textContent=it.o;const sN=SYL[it.sy];
  $('#dTag').textContent=`第${it.ch}章 ${DATA.chapters[it.ch]?.cn||''} · ${setLabel(it.ys)}`+(it.sy?` · 考纲 ${it.sy}${sN?' '+sN.en:''}`:'');
  $('#dBody').innerHTML=it.i.map(s=>`<img src="${IMG(s)}" alt="">`).join('');
  const key=it.id.split(':')[1]+'#Q'+it.q;
  if((it.mc===1&&EXPL[key])||(it.a&&it.a.length)){$('#dExpl').hidden=false;$('#dExpl').innerHTML=answerHtml(it);}else $('#dExpl').hidden=true;
  $('#dMark').hidden=it.mc!==1;
  const i=shown.findIndex(x=>x.id===id);$('#dPos').textContent=i>=0?`${i+1} / ${shown.length}`:'';
  $('#dPrev').disabled=i<=0;$('#dNext').disabled=i<0||i>=shown.length-1;$('#dBody').scrollTop=0;
  syncDlg(id);if(!d.open)d.showModal();}
$('#dlg').addEventListener('close',()=>{revRender();renderPlan();});
function step(k){const i=shown.findIndex(x=>x.id===$('#dlg').dataset.id);const j=i+k;if(j>=0&&j<shown.length)openQ(shown[j].id);}
function syncDlg(id){const on=wrong.has(id);$('#dMark').setAttribute('aria-pressed',on);$('#dMark').textContent=on?'已记录 ✓':'标记';}
$('#dMark').onclick=()=>wbToggle($('#dlg').dataset.id);
$('#dClose').onclick=()=>$('#dlg').close();
$('#dPrev').onclick=()=>step(-1);$('#dNext').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(!$('#dlg').open)return;
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  if(e.key===' '){e.preventDefault();const it=byId.get($('#dlg').dataset.id);if(it&&it.mc===1)wbToggle(it.id);}});

   我的：等级 · 成就 · 班级榜 · 账号

let boardCache=null,boardAt=0;
async function loadBoard(){if(boardCache&&Date.now()-boardAt<5*60*1000)return boardCache;try{const j=await rpc('board',{p_token:session.token});if(j.ok){boardCache=j.board||[];boardAt=Date.now();}}catch(e){}return boardCache||[];}
function renderMe(){if($('#viewMe').hidden)return;const st=xpStats(),lv=lvlOf(xp),base=lvlBase(lv),next=lvlBase(lv+1),sk=streak(),T=ptype();
  let html=`<div class="card"><div class="hero2"><div class="lvl" style="--deg:${Math.round((xp-base)/(next-base)*360)}deg"><div>Lv.${lv}<small>${xp} XP</small></div></div>
    <div style="flex:1;min-width:200px"><div class="hi">${esc(profile.display||profile.username)}</div><div class="n" style="font-size:12px">${esc(profile.username)} · ${T.label}计划${profile.klass?` · ${esc(profile.klass)} 班`:''}</div>
    <div class="xpbar"><i style="width:${Math.round((xp-base)/(next-base)*100)}%"></i></div><div class="n">距 Lv.${lv+1} 还差 ${next-xp} XP · 🔥 连续打卡 ${sk} 天</div></div></div>
    <div class="stat" style="margin-top:12px"><div><b>${st.answered}</b><small>已作答</small></div><div><b>${st.acc!=null?st.acc+'%':'—'}</b><small>选择题正确率</small></div><div><b>${st.p2}</b><small>手写题</small></div><div><b>${st.nmast}</b><small>掌握错题</small></div><div><b>${Object.keys(notes).filter(q=>byId.has(q)).length}</b><small>批注重点</small></div></div></div>`;
  const days=activityDays();const wk=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d.getTime());wk.push({k,n:days.get(k)||0,lbl:i===0?'今天':DOW[(d.getDay()+6)%7]});}
  const mx=Math.max(1,...wk.map(w=>w.n));
  html+=`<div class="card"><h3>本周活动</h3><div class="week">${wk.map(w=>`<div class="${w.n?'':'z'}" style="height:${Math.max(4,w.n/mx*100)}%" title="${w.k}：${w.n} 次"><span>${w.lbl}</span></div>`).join('')}</div><div style="height:18px"></div></div>`;
  const B=badges(),got=B.filter(b=>b.got).length;
  html+=`<div class="card"><h3>成就 <span class="n">${got}/${B.length}</span></h3><div class="badges2">${B.map(b=>`<div class="bd ${b.got?'':'lock'}" title="${esc(b.desc)}"><div class="ic">${b.ic}</div><b>${b.name}</b><small>${b.got?'已获得':`${b.cur}/${b.goal}`}</small></div>`).join('')}</div>
    <div class="n" style="margin-top:8px">XP：作答 +1，选择题答对再 +1，手写提交 +5，自评满分再 +3，在线提交一套 +20，一套错题清零 +10，选择题批注 +2/题，加笔记区 +2/题，掌握错题 +3</div></div>`;
  html+=`<div class="card" id="boardCard"><h3>本班 XP 榜</h3><div class="n">加载中…</div></div>`;
  html+=`<div class="card"><h3>账号</h3><div class="kv"><div>用户名 <b>${esc(profile.username)}</b> · 姓名 <b>${esc(profile.display||'—')}</b></div><div>刷题计划 <b>${T.label}</b> <span class="n">${T.desc}</span></div>
    <div class="n">${npend()?`有 ${npend()} 项改动还没同步到服务器，联网后会自动补传`:'所有记录已保存在你的账号里，换设备登录即可看到'}</div>${profile.role==='teacher'?'<div><a href="teacher.html" style="color:var(--crimson)">→ 打开教师端</a></div>':''}</div>
    <details id="pwBox" style="margin-top:10px"><summary>修改密码</summary><div style="margin-top:8px;display:grid;gap:8px;max-width:360px">
      <input type="password" id="pwOld" placeholder="原密码" autocomplete="current-password"><input type="password" id="pwNew" placeholder="新密码（至少 4 位）" autocomplete="new-password"><input type="password" id="pwNew2" placeholder="再输一遍新密码" autocomplete="new-password">
      <div style="display:flex;gap:8px;align-items:center"><button class="primary" id="pwOk">保存新密码</button><span class="msg" id="pwMsg"></span></div></div></details>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"><span class="n">版本 ${BUILD}</span><button id="btnLogout">退出登录</button></div></div>`;
  $('#meWrap').innerHTML=html;
  loadBoard().then(b=>{const el=$('#boardCard');if(!el||!b)return;const me=profile.username;const list=b.map((x,i)=>({...x,rk:i+1,xp:x.u===me?xp:x.xp}));
    const top=list.slice(0,5);const mine=list.find(x=>x.u===me);if(mine&&mine.rk>5)top.push(mine);
    el.innerHTML=`<h3>本班 XP 榜 <span class="n">${b.length} 人</span></h3><ul class="board" style="list-style:none;margin:0;padding:0">${top.map(x=>`<li class="${x.u===me?'me':''}"><span class="rk">${x.rk<=3?['🥇','🥈','🥉'][x.rk-1]:x.rk}</span><span>${esc(x.n)}</span><span class="xp">${x.xp} XP · Lv.${lvlOf(x.xp)}</span></li>`).join('')||'<li class="n">还没有同学上榜</li>'}</ul>`;});}
document.addEventListener('click',async e=>{
  if(e.target.id==='btnLogout'){if(npend()&&!confirm(`还有 ${npend()} 项改动没同步，退出会丢失，确定？`))return;logout(false);return;}
  if(e.target.id==='pwOk'){const o=$('#pwOld').value,n=$('#pwNew').value,n2=$('#pwNew2').value,m=$('#pwMsg');m.className='msg';
    if(n.length<4){m.className='msg bad';m.textContent='新密码至少 4 位';return;}
    if(n!==n2){m.className='msg bad';m.textContent='两次输入的新密码不一样';return;}
    try{const j=await rpc('change_password',{p_token:session.token,p_old:o,p_new:n});if(!j.ok){m.className='msg bad';m.textContent=j.error||'失败';return;}
      m.className='msg good';m.textContent='已修改';['#pwOld','#pwNew','#pwNew2'].forEach(s=>$(s).value='');}
    catch(err){m.className='msg bad';m.textContent=errMsg(err);}}});

/* ---------- PDF（浏览器内生成，无需任何库） ---------- */
$('#btnPdf').onclick=async()=>{
  const btn=$('#btnPdf'),pr=$('#prog');
  const list=DATA.items.filter(i=>wrong.has(i.id)).sort((a,b)=>a.p.localeCompare(b.p)||a.ch-b.ch||a.n-b.n);
  if(!list.length)return;
  btn.disabled=true;btn.textContent='生成中…';pr.hidden=false;pr.value=0;
  try{const blob=await buildPDF(list,{answers:$('#incAns').checked,oneEach:$('#oneEach').checked},f=>{pr.value=Math.round(f*100);});
    deliver(blob,`错题集_${(profile&&profile.display)||''}_${new Date().toISOString().slice(0,10)}_${list.length}题.pdf`);}
  catch(err){alert('生成失败：'+err.message+'\n\n题目很多时手机内存可能不够，可以分几次导出。');}
  finally{pr.hidden=true;counts();}};
function deliver(blob,name){
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';
  try{a.click();}catch(e){}
  const bar=$('#pdfdone');
  bar.innerHTML=`<span>错题集已生成（${(blob.size/1024/1024).toFixed(1)} MB）</span><a class="dl" href="${url}" download="${esc(name)}" target="_blank" rel="noopener">下载 / 打开 PDF</a><button id="doneX">收起</button>`;
  bar.hidden=false;$('#doneX').onclick=()=>{bar.hidden=true;URL.revokeObjectURL(url);};
  toast('已生成，点「下载 / 打开 PDF」保存');}
const A4=[595.28,841.89],M=36,CW=A4[0]-2*M,TW=820;
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error('图片加载失败: '+src));im.src=IMG(src);});}
function canvasJPEG(cv,q){const url=cv.toDataURL('image/jpeg',q||.82),b64=url.slice(url.indexOf(',')+1);const bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
function imgToJPEG(im,maxW){const w=Math.min(im.naturalWidth,maxW||1400),h=Math.round(im.naturalHeight*w/im.naturalWidth);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);return{bytes:canvasJPEG(cv,.85),w,h};}
function textToJPEG(lines,widthPx){const cv=document.createElement('canvas'),padx=14,lh=26;cv.width=widthPx;const cx=cv.getContext('2d');
  cx.font='16px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';const wrapped=[];
  for(const ln of lines){let cur='';for(const ch of [...ln.t]){if(cx.measureText(cur+ch).width>widthPx-2*padx){wrapped.push({t:cur,c:ln.c,b:ln.b});cur=ch;}else cur+=ch;}wrapped.push({t:cur,c:ln.c,b:ln.b});}
  cv.height=padx*2+wrapped.length*lh;const c2=cv.getContext('2d');c2.fillStyle='#fff';c2.fillRect(0,0,cv.width,cv.height);
  wrapped.forEach((ln,i)=>{c2.font=(ln.b?'bold ':'')+'16px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';c2.fillStyle=ln.c||'#1e232a';c2.fillText(ln.t,padx,padx+lh*(i+1)-7);});
  return{bytes:canvasJPEG(cv,.9),w:cv.width,h:cv.height};}
async function buildPDF(list,opt,onProg){
  const pages=[];let cur=null,y=0,placed=0;const imgs=[];
  const newPage=()=>{cur={ops:[]};pages.push(cur);y=M;placed=0;};
  const place=(obj,gap)=>{const dh=obj.h*CW/obj.w;if(!cur||y+dh>A4[1]-M)newPage();imgs.push(obj);cur.ops.push({idx:imgs.length-1,x:M,y:A4[1]-y-dh,w:CW,h:dh});y+=dh+(gap===undefined?8:gap);placed++;};
  const head=t=>{const o=textToJPEG([{t,b:true,c:'#A51C30'}],TW);const dh=o.h*CW/o.w;if(!cur||y+dh+40>A4[1]-M)newPage();imgs.push(o);cur.ops.push({idx:imgs.length-1,x:M,y:A4[1]-y-dh,w:CW,h:dh});y+=dh+4;placed++;};
  const label=it=>`#${pad(it.n)}　【第${it.ch}章 ${DATA.chapters[it.ch]?.cn||''}】${setLabel(it.ys)}　${it.o}`;
  newPage();head(`错题集 · ${(profile&&profile.display)||''} · 共 ${list.length} 题 · ${new Date().toLocaleDateString('zh-CN')}`);y+=6;
  let done=0,total=list.length*(opt.answers?2:1);
  for(const it of list){if(opt.oneEach&&placed>0)newPage();head(label(it));for(const s of it.i)place(imgToJPEG(await loadImg(s)));
    if(notes[it.id]&&notes[it.id].b!==FLAG)place(textToJPEG([{t:'📝 '+notes[it.id].b,c:'#1f4e79'}],TW),6);y+=10;onProg&&onProg(++done/total);}
  if(opt.answers){newPage();head('答案与解析');y+=6;
    for(const it of list){head(label(it));const key=it.id.split(':')[1]+'#Q'+it.q,ex=EXPL[key];
      if(it.mc===1&&ex){const lines=[{t:`答案：${it.L||'?'}   考点：${ex.point||''}`,b:true}];for(const L of ['A','B','C','D'])lines.push({t:`${L===it.L?'✓':'✗'} ${L}  ${ex[L]||''}`,c:L===it.L?'#1E7A34':'#A51C30'});place(textToJPEG(lines,TW),6);}
      else if(it.a&&it.a.length){for(const s of it.a)place(imgToJPEG(await loadImg(s)),6);}
      else place(textToJPEG([{t:'（本题无收录答案）',c:'#6e7681'}],TW),6);
      y+=8;onProg&&onProg(++done/total);}}
  return serialise(pages,imgs);}
function serialise(pages,imgs){
  const enc=new TextEncoder(),chunks=[];let len=0;
  const push=d=>{const b=typeof d==='string'?enc.encode(d):d;chunks.push(b);len+=b.length;return b;};
  const offs=[],obj=[];const nImg=imgs.length,nPage=pages.length;
  const idPage=i=>3+i,idCont=i=>3+nPage+i,idImg=i=>3+2*nPage+i;
  obj[1]=`<< /Type /Catalog /Pages 2 0 R >>`;
  obj[2]=`<< /Type /Pages /Count ${nPage} /Kids [${pages.map((_,i)=>`${idPage(i)} 0 R`).join(' ')}] >>`;
  pages.forEach((p,i)=>{const res=p.ops.map(o=>`/I${o.idx} ${idImg(o.idx)} 0 R`).join(' ');obj[idPage(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4[0]} ${A4[1]}] /Resources << /XObject << ${res} >> >> /Contents ${idCont(i)} 0 R >>`;});
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const writeObj=(id,body,stream)=>{offs[id]=len;push(`${id} 0 obj\n${body}\n`);if(stream){push('stream\n');push(stream);push('\nendstream\n');}push('endobj\n');};
  writeObj(1,obj[1]);writeObj(2,obj[2]);
  pages.forEach((p,i)=>writeObj(idPage(i),obj[idPage(i)]));
  pages.forEach((p,i)=>{const s=p.ops.map(o=>`q ${o.w.toFixed(2)} 0 0 ${o.h.toFixed(2)} ${o.x.toFixed(2)} ${o.y.toFixed(2)} cm /I${o.idx} Do Q`).join('\n');const bytes=enc.encode(s);writeObj(idCont(i),`<< /Length ${bytes.length} >>`,bytes);});
  imgs.forEach((im,i)=>{writeObj(idImg(i),`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`,im.bytes);});
  const xref=len,n=idImg(nImg-1)+1;
  let x=`xref\n0 ${n}\n0000000000 65535 f \n`;for(let i=1;i<n;i++)x+=String(offs[i]||0).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let o=0;for(const c of chunks){out.set(c,o);o+=c.length;}
  return new Blob([out],{type:'application/pdf'});}

boot();
