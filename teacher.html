<style>
:root{--crimson:#A51C30;--crimson-d:#6F1220;--crimson-l:#C8455A;--bg:#f7f5f5;--card:#fff;--ink:#1e232a;--muted:#6e7681;--line:#e6e2e2;
  --hi:#fdf3f4;--green:#1E7A34;--green-l:#e6f4ea;--amber:#b7791f;--amber-l:#fff6e5;--sat:#f3e9eb;--radius:12px;
  --shadow:0 1px 2px rgba(30,20,22,.06),0 8px 24px rgba(30,20,22,.07)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
header{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
.hbar{height:3px;background:linear-gradient(90deg,var(--crimson),var(--crimson-d))}
.hin{padding:9px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hin img{width:32px;height:32px;object-fit:contain}
.t1{font-weight:700;color:var(--crimson);line-height:1.15}.t2{font-size:11px;color:var(--muted)}
.grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--crimson);color:#fff;border-color:var(--crimson);font-weight:600}
button.sm{font-size:12px;padding:3px 9px}
button.danger{color:var(--crimson);border-color:var(--crimson-l)}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);max-width:100%}
input:focus,select:focus{outline:2px solid var(--crimson);outline-offset:-1px}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;color:var(--crimson)}
.sub{font-size:12px;color:var(--muted)}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.live.on{background:var(--green-l);color:var(--green)}.live.off{background:var(--amber-l);color:var(--amber)}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{border-radius:99px;padding:6px 16px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.cls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.cls button{border-radius:99px;padding:4px 12px;font-size:13px}
.cls button[aria-pressed="true"]{background:var(--sat);border-color:var(--crimson-l);color:var(--crimson);font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.sort{cursor:pointer}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--crimson)}
.pct{font-weight:700;color:var(--crimson);white-space:nowrap}
.late{color:var(--crimson);font-weight:700}.ok{color:var(--green);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--hi);border-radius:10px;padding:8px 14px;text-align:center;min-width:86px}
.chip b{display:block;font-size:20px;color:var(--crimson)}
.chip small{color:var(--muted);font-size:11px}
.heat{display:grid;grid-template-columns:auto repeat(4,1fr);gap:3px;font-size:11px;margin-top:8px;max-width:520px}
.heat .h{color:var(--muted);text-align:center}
.heat .c{height:20px;border-radius:5px;background:var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.heat .c.d1{background:#e8c3ca}.heat .c.d2{background:#c8455a}.heat .c.d3{background:var(--green)}.heat .c.opt{opacity:.45}
.heat .c.late{outline:2px solid var(--crimson);outline-offset:-2px}
.name{font-weight:700;cursor:pointer;color:var(--crimson)}
.ptag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--sat);color:var(--crimson);white-space:nowrap}
.ktag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#e8f0fb;color:#1f4e79;white-space:nowrap}
.det{background:var(--bg)}
.detin{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.qtag{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:99px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card)}
.qtag:hover{border-color:var(--crimson-l);color:var(--crimson)}
.qtag b{color:var(--crimson)}
.qtag.m{opacity:.55;text-decoration:line-through}
.code{font:700 13px/1 ui-monospace,Menlo,monospace;color:var(--crimson);white-space:nowrap}
.pts{margin:6px 0 2px;padding-left:18px;font-size:12.5px;color:var(--muted)}
.pts li{margin:2px 0}
details{margin-top:4px}
summary{cursor:pointer;color:var(--crimson);font-size:13px}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.scard{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.scard b{color:var(--crimson)}
/* 手机上的学生卡片（代替宽表格） */
.tablewrap{display:block}.stack{display:none}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.pcard .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pcard .pr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:13px}
.pcard .pf{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.pcard .pdet{margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
/* 全班矩阵：学生名竖排，格子保持紧凑；首列固定 */
.mxwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
.mx{border-collapse:separate;border-spacing:2px;font-size:11px;width:auto}
.mx th{padding:3px 4px;border:0;font-weight:600;text-align:center;font-size:11px;background:var(--card)}
.mx th.rh{text-align:left;white-space:nowrap;position:sticky;left:0;z-index:2;padding-right:8px}
.mx th.v{vertical-align:bottom;padding:4px 0}
.mx th.v span{display:inline-block;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;max-height:150px;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;line-height:1.1;letter-spacing:.02em}
.mx td{padding:0;border:0}
.mx .c{width:32px;height:22px;border-radius:5px;background:var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.mx .c.d1{background:#e8c3ca}.mx .c.d2{background:#c8455a}.mx .c.d3{background:var(--green)}.mx .c.s1,.heat .c.s1{background:#1f4e79}.mx .c.s2,.heat .c.s2{background:#b7791f}.mx .c.s3,.heat .c.s3{background:var(--green)}.mx .c.late{outline:2px solid var(--crimson);outline-offset:-2px}.mx .c.opt{opacity:.4}
.mx tr:nth-child(4n+2) th.rh{border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:34px}
.msg{font-size:13px;min-height:18px}.msg.bad{color:var(--crimson)}.msg.good{color:var(--green)}
textarea{width:100%;height:80px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--ink)}
/* 登录 */
.login{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 26px 22px;width:100%;max-width:380px;text-align:center}
.lcard img{width:64px;height:64px;object-fit:contain}
.lcard h1{font-size:18px;color:var(--crimson);margin:10px 0 2px}
.lcard input{width:100%;margin:5px 0;font-size:15px;padding:10px 12px;text-align:left}
.lcard .err{color:var(--crimson);font-size:13px;min-height:18px;margin:2px 0 6px}
.lcard .primary{width:100%;padding:10px;font-size:15px}
/* 对话框 */
dialog{border:0;border-radius:12px;padding:0;max-width:min(920px,94vw);width:920px;background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
dialog.sm{width:440px;max-width:94vw}
dialog::backdrop{background:rgba(20,10,12,.62)}
.dh{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.db{max-height:60vh;overflow:auto;background:#fff}
.db img{width:100%;display:block}
.dbody{padding:14px;display:grid;gap:9px}
.dbody label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.dbody input,.dbody select{width:100%}
.expl{padding:12px 14px;border-top:1px solid var(--line);font-size:14px;max-height:30vh;overflow:auto}
.okc{color:var(--green);font-weight:700}.badc{color:var(--crimson);font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--crimson) 10%,transparent);color:var(--crimson)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;white-space:nowrap}
.toast.show{opacity:1}
/* ---- 平板 ---- */
@media(max-width:1024px){td,th{padding:6px 5px;font-size:13px}.wrap{padding:12px 12px 50px}}
/* ---- 手机 ---- */
@media(max-width:760px){
  .tablewrap{display:none}.stack{display:block}
  .wrap{padding:10px 10px 50px}
  .hin{padding:7px 10px;gap:8px}.hin img{width:28px;height:28px}.t1{font-size:14px}.t2{display:none}#who{display:none}#btnPrint{display:none}
  .chips{gap:6px}.chip{min-width:0;flex:1 1 30%;padding:6px 6px}.chip b{font-size:17px}.chip small{font-size:10px}
  .tabs{gap:5px}.tabs button{flex:1;padding:6px 6px;font-size:13px;white-space:nowrap}
  .card{padding:11px}
  table.syl th:nth-child(4),table.syl td:nth-child(4){display:none}
  table.syl td{padding:6px 4px}.code{font-size:12px}
  .stu{grid-template-columns:1fr}
  .heat{max-width:none}
  dialog{width:auto}.db{max-height:55vh}
  .lcard{padding:22px 18px 18px}}
@media print{header,.tabs,.cls,.noprint{display:none!important}.card{box-shadow:none}}
/* ---- 批作业（全屏批改） ---- */
.grader{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}.grader.on{display:flex}
.gh{display:flex;gap:6px;align-items:center;padding:7px 10px;padding-top:calc(7px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.gh .ttl{font-weight:700;color:var(--crimson);font-size:14px}
.gtools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.gtools .tb{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;border-radius:9px}
.gtools .tb.wide{width:auto;padding:0 10px;font-size:13px}
.gtools [aria-pressed="true"]{border-color:var(--crimson);box-shadow:0 0 0 2px color-mix(in srgb,var(--crimson) 25%,transparent)}
.gtools .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}.gtools .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.gtools .wsz{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}.gtools .wsz i{display:block;background:var(--ink);border-radius:99px;width:14px}
.gtools .sep{width:1px;height:24px;background:var(--line);margin:0 3px}
.gprog{display:flex;gap:3px;align-items:center;padding:5px 10px 6px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.gprog i{flex:1;height:6px;border-radius:3px;background:var(--line);cursor:pointer}.gprog i.s{background:var(--green)}.gprog i.p{background:var(--amber)}.gprog i.cur{box-shadow:0 0 0 2px var(--crimson)}
.gprog span{font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap}
.gbody{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ginner{max-width:900px;margin:0 auto}
.gstrip{position:relative;background:#fff;border:1px solid var(--line);margin-bottom:6px;line-height:0}
.gstrip img{width:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.gstrip canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.gstrip.nb{border-top:1px dashed #d9d0b3}.gstrip.nb .nbg{background:#fffdf5;background-image:repeating-linear-gradient(transparent 0 27px,#e6dfc6 27px 28px);width:100%}
.gstrip.nb .nbl{position:absolute;left:8px;top:4px;font-size:11px;color:#a89f80;line-height:1.2;pointer-events:none}
.gpanel{background:var(--card);border:1px solid var(--line);border-left:3px solid #6366f1;border-radius:var(--radius);padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.5}
.gpanel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper button{width:36px;height:36px;padding:0;font-size:18px}.stepper b{min-width:70px;text-align:center;font-size:17px;color:#4338ca}
.gpanel textarea{flex:1;min-width:200px;height:60px;font:14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.gans{margin-top:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--radius);padding:10px 12px}.gans img{width:100%;display:block}
.gf{flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gtag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#eef2ff;color:#4338ca;white-space:nowrap}
.gtip{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--ink);color:#fff;padding:7px 14px;border-radius:99px;font-size:13px;pointer-events:none;z-index:2}
@media(max-width:760px){.gh .ttl{width:100%;order:-1}.gtools .tb{width:32px;height:32px;font-size:14px}.gf button{padding:6px 9px;font-size:13px}}
/* ---- 讲题模式（左：题目 + 老师板书；右：全班答案） ---- */
.lecture{position:fixed;inset:0;z-index:71;background:var(--bg);display:none;flex-direction:column;--lw:56%}.lecture.on{display:flex}
.lmain{flex:1;display:flex;min-height:0;position:relative}
.lleft{width:var(--lw);min-width:30%;max-width:78%;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.lsplit{width:10px;flex:none;background:var(--line);cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.lsplit i{width:3px;height:36px;border-radius:2px;background:#fff}
.lright{flex:1;min-width:0;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#efece8}
.lgrid{display:grid;grid-template-columns:repeat(var(--lcols,2),1fr);gap:8px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.lcard.pin{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-l)}
.lcard.dragging{opacity:.45}
.lcard .lh{display:flex;gap:4px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);font-size:12px;background:var(--card);flex-wrap:nowrap}
.lcard .lh b{color:var(--crimson);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lcard .lh button{font-size:12px;padding:1px 6px;border-radius:7px;white-space:nowrap;line-height:1.3;flex:none}
.lcard .drag{cursor:grab;touch-action:none;color:var(--muted);font-size:15px;padding:0 4px;user-select:none}
.lcard .lb{padding:4px;line-height:0}
.lcard .ls{position:relative;line-height:0;margin-bottom:3px;border:1px solid #eee}
.lcard .ls img{width:100%;display:block;pointer-events:none}
.lcard .ls canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lcard .lempty{padding:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.4}
.lbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.lbar button{font-size:12px;padding:3px 9px;border-radius:99px}.lbar button[aria-pressed="true"]{background:var(--sat);border-color:var(--crimson-l);color:var(--crimson);font-weight:600}
.lwho{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.lwho b{color:#4338ca}
@media(max-width:760px){.lecture{--lw:52%}.lgrid{--lcols:1}}
</style>
</head>

ard of the mark will be based on the scatter of points on a graph; in other cases, the candidate’s data may be compared with information supplied by the supervisor or known to the examiners. The examiners will only consider the extent to which the candidate has affected the quality of the data: allowances will be made where the quality of data is limited by the experimental method required or by the apparatus used. • present numerical data and values in a single table of results • record all data in the table • draw up the table in advance of taking readings so that they do not have to copy up their results • include in the table of results columns for raw data and for values calculated from them • use column headings that include both the quantity and the unit and that conform to accepted scientific conventions. As an example of accepted scientific convention in column headings, if the quantity being measured is current in milliamperes, then ‘I / mA’ would be the usual way to write the column heading, but ‘I in mA’ or ‘I (mA)’ or ‘current / mA’ would be allowed. Headings such as ‘I mA’ or just ‘mA’ are not acceptable. The quantity or the unit or both may be written in words rather than symbols. Conventional symbols or abbreviations (such as p.d.) may be used without explanation. Recording of data, observations and calculations • record raw readings of a quantity to the same degree of precision • calculate other quantities from their raw data • show their working in calculations, and the key steps in their reasoning • use and justify the correct number of significant figures in calculated quantities. For example, if one measurement of length in a column of raw data is given to the nearest millimetre, then all the lengths in that column should be given to the nearest millimetre. The degree of precision used should be compatible with the measuring instrument used: it would be inappropriate to record a distance measured on a millimetre scale as either ‘2 cm’ or ‘2.00 c function smoothPts(pts){const P=[];for(let k=0;k<pts.length;k+=2)P.push([pts[k],pts[k+1]]);if(P.length<3)return P;
  const out=[P[0]];for(let i=1;i<P.length-1;i++)out.push([(P[i-1][0]+2*P[i][0]+P[i+1][0])/4,(P[i-1][1]+2*P[i][1]+P[i+1][1])/4]);out.push(P[P.length-1]);return out;}

function drawStroke(c,s,Wd){if(s.f){const x=s.p[0]*Wd,y=s.p[1]*Wd,rad=Math.max(10,Wd*0.018);c.strokeStyle='#dc2626';c.lineWidth=2.5;c.beginPath();c.arc(x,y,rad,0,Math.PI*2);c.stroke();c.fillStyle='#dc2626';c.font=`bold ${rad*1.3}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('✗',x,y+1);return;}
  if(s.k){c.strokeStyle=s.c;c.lineWidth=s.w*Wd;c.beginPath();for(let k=0;k<s.p.length;k+=2){k?c.lineTo(s.p[k]*Wd,s.p[k+1]*Wd):c.moveTo(s.p[k]*Wd,s.p[k+1]*Wd);}c.stroke();return;}
  const P=smoothPts(s.p),base=s.w*Wd;c.fillStyle=s.c;c.strokeStyle=s.c;
  if(P.length<2){c.beginPath();c.arc(P[0][0]*Wd,P[0][1]*Wd,base/2,0,Math.PI*2);c.fill();return;}
  const q=s.q&&s.q.length===P.length?s.q:null;
  if(!q){c.lineWidth=base;c.beginPath();curvePath(c,P,Wd);c.stroke();return;}
  const w=q.map(v=>base*(0.55+0.9*v)),ws=w.map((v,i)=>i&&i<w.length-1?(w[i-1]+v+w[i+1])/3:v);

const G={mode:'grade',u:null,set:null,q:null,list:[],ink:{},grade:{},cur:null,tool:'pen',color:'#dc2626',width:2.5,finger:false,showAnn:false,showAns:false,penSeen:false,penNear:0,penActive:false,scroll:null,dirty:false,saveT:null,seq:0};
function gTip(m){const t=$('#gTip');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3000);}
function gToolbar(){return `<button class="tb" data-gtool="pen" aria-pressed="${G.tool==='pen'}" title="红笔">✏️</button><button class="tb" data-gtool="eraser" aria-pressed="${G.tool==='eraser'}" title="橡皮（整笔擦，只擦老师的笔迹）">🧽</button><span class="sep"></span>${['#dc2626','#1d4ed8','#16a34a','#1e232a'].map(c=>`<button class="sw" data-gcolor="${c}" aria-pressed="${G.color===c}" style="background:${c}"></button>`).join('')}<span class="sep"></span>${[[2,3],[3.2,5],[5,8]].map(([w,h])=>`<button class="wsz" data-gw="${w}" aria-pressed="${G.width===w}"><i style="height:${h}px"></i></button>`).join('')}<span class="sep"></span><button class="tb" data-gact="undo" title="撤销">↶</button><button class="tb" data-gact="clear" title="清空本题笔迹">🗑</button><button class="tb wide" data-gact="ann" aria-pressed="${G.showAnn}" title="显示学生交卷后写的批注层">学生批注</button><button class="tb wide" data-gact="finger" aria-pressed="${G.finger}" title="没有笔时用手指写">☝️ 手指</button>`;}
async function openGrader(u,set,q){await gSave();G.mode='grade';G.u=u;G.set=set;G.list=setItems(set).map(i=>i.id);G.q=q||G.list[0];G.ink={};G.grade={};
  $('#grader').classList.add('on');document.body.style.overflow='hidden';gLoad();}
function gKnown(q){const g=(RS&&RS.set===G.set?RS.grades:[]).find(x=>x.u===G.u&&x.q===q);return g?(g.sc!=null||g.n>0||g.c):false;}
function gProg(){const box=$('#gProg');const i=G.list.indexOf(G.q);box.innerHTML=G.list.map((q,k)=>{const gr=G.grade[q];const done=gr?(gr.score!=null||(gr.strokes&&gr.strokes.length)||gr.comment):gKnown(q);const part=gr&&gr.score==null&&done;return `<i class="${done?(part?'p':'s'):''} ${k===i?'cur':''}" data-gq="${q}" title="#${pad(byId.get(q).n)}"></i>`;}).join('')+`<span>第 ${i+1} / ${G.list.length} 题</span>`;}
async function gLoad(){const q=G.q,u=G.u,it=byId.get(q);if(!it)return;
  $('#gTitle').textContent=`${S[u]?S[u].n:u} · #${pad(it.n)} ${it.o} · 第${it.ch}章${it.t?` · ${it.t} 分`:''}`;
  $('#gTools').innerHTML=gToolbar();$('#gInner').innerHTML='<div class="empty">加载中…</div>';$('#gStatus').textContent='';
  const i0=G.list.indexOf(q);$('#gPrev').disabled=i0<=0;$('#gNext').disabled=i0>=G.list.length-1;gProg();
  if(!G.ink[q]){try{const j=await rpc('teacher_grade_get',{p_token:session.token,p_user:u,p_qid:q});if(j.ok){G.ink[q]=j.ink||[];if(j.grade)G.grade[q]=j.grade;}else throw new Error(j.error);}
    catch(e){G.ink[q]=[];if(e.message==='NOINIT'||/teacher_grade_get/.test(e.message)){$('#gInner').innerHTML='<div class="empty">批作业功能需要先在 Supabase 运行 <b>_private/update3.sql</b>（建 grades 表和批改函数）。</div>';return;}}}
  if(G.q!==q)return;
  const strokes=G.ink[q];const selfA=(RS&&RS.set===G.set?RS.attempts:[]).find(x=>x.u===u&&x.q===q);const self=selfA&&selfA.s&&/^\d+\/\d+$/.test(selfA.a||'')?selfA.a:null;
  const gr=G.grade[q]||(G.grade[q]={score:null,total:it.t||(self?+self.split('/')[1]:null),comment:'',strokes:[],_new:true});
  if(gr.total==null)gr.total=it.t||(self?+self.split('/')[1]:null);
  const nbR=k=>{let m=0;for(const s of strokes)if(s.i===100+k)for(let j=1;j<s.p.length;j+=2)m=Math.max(m,s.p[j]);return Math.max(0.18,m+0.06);};
  const submitted=!!(selfA&&selfA.s);
  $('#gInner').innerHTML=`${submitted?'':'<div class="sub" style="margin-bottom:6px">⚠ 这题学生还没点「保存」，看到的是草稿</div>'}${strokes.filter(s=>!s.a&&!s.f).length?'':'<div class="sub" style="margin-bottom:6px">这题学生没有手写内容</div>'}`+
    it.i.map((src,i)=>`<div class="gstrip" data-i="${i}"><img src="${IMG(src)}" alt=""><canvas data-i="${i}"></canvas></div>`+(strokes.some(s=>s.i===100+i)?`<div class="gstrip nb" data-i="${100+i}"><div class="nbg" style="padding-bottom:${(nbR(i)*100).toFixed(1)}%"></div><canvas data-i="${100+i}"></canvas><span class="nbl">📝 学生笔记区</span></div>`:'')).join('')+
    `<div class="gpanel"><div class="row"><b>打分</b><div class="stepper"><button id="gMinus">−</button><b id="gVal">${gr.score==null?'—':gr.score} / ${gr.total||'?'}</b><button id="gPlus">＋</button></div>${gr.total?'':'<input type="number" id="gTot" placeholder="满分" min="1" max="30" style="width:76px">'}<button id="gFull">全对 ✓</button><button id="gZero">0 分</button><span class="sub">${self?`学生自评 ${self}`:'学生没有自评'}${gr.teacher&&!gr._new?` · 上次 ${esc(gr.teacher)} 批过`:''}</span></div>
      <div class="row" style="margin-top:8px;align-items:flex-start"><b style="padding-top:8px">评语</b><textarea id="gCom" placeholder="写给学生的话（可选）；也可以直接用笔写在题上">${esc(gr.comment||'')}</textarea></div>
      <div class="sub" style="margin-top:6px">题上的红笔、分数、评语都自动保存；学生端打开这题就能看到（自评不会被覆盖，两者并列显示）。</div></div>
    <div class="gans" id="gAnsBox" ${G.showAns?'':'hidden'}><b>评分方案</b>${(it.a&&it.a.length)?it.a.map(x=>`<img src="${IMG(x)}" alt="">`).join(''):'<div class="sub">本题没有收录答案</div>'}</div><div style="height:30vh"></div>`;
  $('#gInner').querySelectorAll('.gstrip canvas').forEach(cv=>{gBind(cv);const bg=cv.previousElementSibling;if(bg.tagName!=='IMG'||(bg.complete&&bg.naturalWidth))gFit(cv);else bg.onload=()=>gFit(cv);});
  setTimeout(()=>$('#gInner').querySelectorAll('.gstrip canvas').forEach(gFit),300);
  const setScore=v=>{const T=gr.total||+($('#gTot')&&$('#gTot').value)||null;if(!T)return gTip('先填满分');gr.total=T;gr.score=v==null?null:Math.max(0,Math.min(T,v));$('#gVal').textContent=`${gr.score==null?'—':gr.score} / ${T}`;gMark();};
  $('#gMinus').onclick=()=>setScore((gr.score==null?(gr.total||0):gr.score)-1);
  $('#gPlus').onclick=()=>setScore((gr.score==null?-1:gr.score)+1);
  $('#gFull').onclick=()=>setScore(gr.total||+($('#gTot')&&$('#gTot').value)||0);
  $('#gZero').onclick=()=>setScore(0);
  const tot=$('#gTot');if(tot)tot.onchange=()=>{gr.total=+tot.value||null;$('#gVal').textContent=`${gr.score==null?'—':gr.score} / ${gr.total||'?'}`;if(gr.score!=null)gMark();};
  let cT;$('#gCom').oninput=()=>{gr.comment=$('#gCom').value;clearTimeout(cT);cT=setTimeout(gMark,600);};
  $('#gBody').scrollTop=0;}
function gFit(cv){const bg=cv.previousElementSibling;const r=bg.getBoundingClientRect();if(!r.width)return;const dpr=devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cv.style.height=r.height+'px';gRedraw(cv);}
function gCtx(cv){const c=cv.getContext('2d');const dpr=devicePixelRatio||1;c.setTransform(dpr,0,0,dpr,0,0);c.lineCap='round';c.lineJoin='round';return c;}
/* 当前正在写的笔迹数组：批改模式 = 该生该题的批改；讲题模式 = 老师自己的板书 */
const gTarget=()=>{if(G.mode==='lecture')return L.ink[G.q]=L.ink[G.q]||[];const gr=G.grade[G.q];if(!gr)return null;return gr.strokes=gr.strokes||[];};
const gChanged=()=>G.mode==='lecture'?lMark():gMark();
function gRedraw(cv){const i=+cv.dataset.i,q=G.q;const c=gCtx(cv);const Wd=cv.getBoundingClientRect().width||1;c.clearRect(0,0,cv.width,cv.height);
  const base=G.mode==='lecture'?(L.base||[]):(G.ink[q]||[]);
  for(const s of base){if(s.i!==i)continue;if((s.a||s.f)&&!G.showAnn)continue;drawStroke(c,s,Wd);}
  const own=G.mode==='lecture'?(L.ink[q]||[]):((G.grade[q]||{}).strokes||[]);for(const s of own)if(s.i===i)drawStroke(c,s,Wd);}
const gRedrawAll=()=>document.querySelectorAll('#gInner canvas, #lInner canvas').forEach(gRedraw);
const gNorm=(e,cv)=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.width];};
const gPress=e=>e.pointerType==='pen'?Math.max(0.05,Math.min(1,e.pressure||0.5)):0.5;
const gPalm=e=>e.pointerType==='touch'&&G.penSeen&&((e.width||0)>=70||(e.height||0)>=70);
const gBusy=()=>G.penActive||Date.now()-G.penNear<1200;
function gBind(cv){cv.addEventListener('pointerdown',e=>gDown(e,cv));cv.addEventListener('pointermove',e=>gMove(e,cv));['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,e=>gUp(e,cv)));}
function gDown(e,cv){if(e.pointerType==='mouse'&&e.button!==0)return;if(e.pointerType==='pen'){G.penSeen=true;G.penNear=Date.now();G.penActive=true;}
  if(e.pointerType==='touch'){if(gPalm(e)||gBusy())return;if(!G.finger){const sc=G.mode==='lecture'?$('#lLeft'):$('#gBody');G.scroll={id:e.pointerId,y:e.clientY,top:sc.scrollTop,sc};try{cv.setPointerCapture(e.pointerId);}catch(x){}return;}}
  e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}const [x,y]=gNorm(e,cv);const i=+cv.dataset.i;
  if(G.tool==='eraser'){G.cur={erase:true,cv,id:e.pointerId};gErase(x,y,i,cv);return;}
  const pr=gPress(e),Wd=cv.getBoundingClientRect().width;
  G.cur={cv,id:e.pointerId,i,c:G.color,w:G.width/Wd,p:[+x.toFixed(4),+y.toFixed(4)],qq:e.pointerType==='pen'?[+pr.toFixed(2)]:null,lx:x,ly:y,mx:x,my:y,lw:G.width*(e.pointerType==='pen'?(0.55+0.9*pr):1)};}
function gMove(e,cv){if(G.scroll&&G.scroll.id===e.pointerId){G.scroll.sc.scrollTop=G.scroll.top-(e.clientY-G.scroll.y);return;}
  if(e.pointerType==='pen')G.penNear=Date.now();const cur=G.cur;if(!cur||cur.cv!==cv||cur.id!==e.pointerId)return;e.preventDefault();const Wd=cv.getBoundingClientRect().width;
  if(cur.erase){const [x,y]=gNorm(e,cv);gErase(x,y,+cv.dataset.i,cv);return;}
  let evs=[];try{evs=e.getCoalescedEvents?e.getCoalescedEvents():[];}catch(x){}if(!evs.length)evs=[e];const c=gCtx(cv);c.strokeStyle=cur.c;
  for(const ev of evs){const [px,py]=gNorm(ev,cv);if(Math.hypot((px-cur.lx)*Wd,(py-cur.ly)*Wd)<1.2)continue;const pr=gPress(ev);const tw=G.width*(cur.qq?(0.55+0.9*pr):1);cur.lw=cur.lw*0.7+tw*0.3;
    const nmx=(cur.lx+px)/2,nmy=(cur.ly+py)/2;c.lineWidth=cur.lw;c.beginPath();c.moveTo(cur.mx*Wd,cur.my*Wd);c.quadraticCurveTo(cur.lx*Wd,cur.ly*Wd,nmx*Wd,nmy*Wd);c.stroke();
    cur.p.push(+px.toFixed(4),+py.toFixed(4));if(cur.qq)cur.qq.push(+pr.toFixed(2));cur.lx=px;cur.ly=py;cur.mx=nmx;cur.my=nmy;}}
function gUp(e,cv){if(G.scroll&&G.scroll.id===e.pointerId){G.scroll=null;try{cv.releasePointerCapture(e.pointerId);}catch(x){}return;}
  if(e.pointerType==='pen'&&e.type!=='pointerleave')G.penActive=false;const cur=G.cur;if(!cur||cur.cv!==cv||cur.id!==e.pointerId)return;if(e.type==='pointerleave'&&e.buttons)return;
  G.cur=null;try{cv.releasePointerCapture(e.pointerId);}catch(x){}if(cur.erase)return;
  const s={i:cur.i,c:cur.c,w:+cur.w.toFixed(5),p:cur.p};if(cur.qq&&cur.qq.some(v=>Math.abs(v-cur.qq[0])>0.05))s.q=cur.qq;
  const arr=gTarget();if(!arr)return;arr.push(s);gRedraw(cv);gChanged();}
function gErase(x,y,i,cv){const arr=gTarget();if(!arr||!arr.length)return;const Wd=cv.getBoundingClientRect().width,r=14/Wd;const n=arr.length;
  const keep=arr.filter(s=>{if(s.i!==i)return true;for(let k=0;k<s.p.length;k+=2)if(Math.hypot(s.p[k]-x,s.p[k+1]-y)<r)return false;return true;});
  if(keep.length!==n){arr.length=0;arr.push(...keep);gRedraw(cv);gChanged();}}
function gMark(){G.dirty=true;$('#gStatus').textContent='保存中…';clearTimeout(G.saveT);G.saveT=setTimeout(gSave,900);gProg();}
async function gSave(){clearTimeout(G.saveT);if(!G.dirty)return;const q=G.q,u=G.u,set=G.set,gr=G.grade[q];if(!gr)return;G.dirty=false;const seq=++G.seq;
  try{const j=await rpc('teacher_grade',{p_token:session.token,p_user:u,p_qid:q,p_set:set,p_score:gr.score==null?null:gr.score,p_total:gr.total==null?null:gr.total,p_comment:gr.comment||'',p_strokes:gr.strokes||[]});
    if(!j.ok)throw new Error(j.error);delete gr._new;gr.teacher=session.username;
    if(RS&&RS.set===set){const k=RS.grades.findIndex(x=>x.u===u&&x.q===q);const row={u,q,sc:gr.score,tt:gr.total,c:!!gr.comment,n:(gr.strokes||[]).length,t:Date.now()/1000};if(k>=0)RS.grades[k]=row;else RS.grades.push(row);}
    if(seq===G.seq)$('#gStatus').textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
  catch(e){G.dirty=true;$('#gStatus').textContent='⚠ 没存上：'+(e.message==='NOINIT'?'请先在 Supabase 运行 update3.sql':errMsg(e));}}
async function gGo(k){const i=G.list.indexOf(G.q)+k;if(i<0||i>=G.list.length)return;await gSave();G.q=G.list[i];gLoad();}
async function closeGrader(){await gSave();$('#grader').classList.remove('on');document.body.style.overflow='';G.q=null;pull();}
$('#gBack').onclick=closeGrader;$('#gDone').onclick=closeGrader;
$('#gPrev').onclick=()=>gGo(-1);$('#gNext').onclick=()=>gGo(1);
$('#gAnsBtn').onclick=()=>{G.showAns=!G.showAns;const b=$('#gAnsBox');if(b){b.hidden=!G.showAns;if(G.showAns)b.scrollIntoView({behavior:'smooth'});}};
$('#gProg').addEventListener('click',async e=>{const i=e.target.closest('[data-gq]');if(!i||i.dataset.gq===G.q)return;await gSave();G.q=i.dataset.gq;gLoad();});
function gToolClick(e){const box=e.currentTarget,tipf=G.mode==='lecture'?lTip:gTip;const t=e.target.closest('[data-gtool]');if(t){G.tool=t.dataset.gtool;box.innerHTML=gToolbar();return;}
  const c=e.target.closest('[data-gcolor]');if(c){G.color=c.dataset.gcolor;G.tool='pen';box.innerHTML=gToolbar();return;}
  const w=e.target.closest('[data-gw]');if(w){G.width=+w.dataset.gw;G.tool='pen';box.innerHTML=gToolbar();return;}
  const a=e.target.closest('[data-gact]');if(!a)return;
  if(a.dataset.gact==='undo'){const arr=gTarget();if(!arr||!arr.length)return tipf('没有可撤销的笔迹');arr.pop();gRedrawAll();gChanged();}
  if(a.dataset.gact==='clear'){const arr=gTarget();if(!arr||!arr.length)return;if(!confirm(G.mode==='lecture'?'清空这题的板书？':'清空这题的批改笔迹？（分数、评语保留）'))return;arr.length=0;gRedrawAll();gChanged();}
  if(a.dataset.gact==='ann'){G.showAnn=!G.showAnn;box.innerHTML=gToolbar();gRedrawAll();tipf(G.showAnn?'显示学生交卷后写的批注层':'只显示学生交卷时的原答案');}
  if(a.dataset.gact==='finger'){G.finger=!G.finger;box.innerHTML=gToolbar();tipf(G.finger?'手指也能写；要滚动请关闭':'手指只滚动，Apple Pencil / 鼠标书写');}}
$('#gTools').addEventListener('click',gToolClick);
function lTip(m){const t=$('#lTip');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3000);}
['gesturestart','gesturechange','gestureend'].forEach(t=>$('#gBody').addEventListener(t,e=>e.preventDefault()));
addEventListener('resize',()=>{if($('#grader').classList.contains('on'))$('#gInner').querySelectorAll('canvas').forEach(gFit);});
document.addEventListener('keydown',e=>{if(!$('#grader').classList.contains('on')||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')gGo(1);if(e.key==='ArrowLeft')gGo(-1);if(e.key==='Escape')closeGrader();});
boot();
</script>
</body>
